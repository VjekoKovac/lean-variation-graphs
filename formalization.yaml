version: "v0.4"
project:
  name: "Sharp variational inequalities on finite graphs"
  description: |-
    Let G = (V,E) be a finite connected undirected simple graph. For f : V → ℝ,
    M_G f(v) is the maximum of the averages of |f| over closed graph-distance
    balls centered at v, including the ball of radius zero. For real p > 0,
    Var_p(f) = (∑_{uv∈E} |f(u) − f(v)|^p)^(1/p), counting each edge once.

    Theorem 1. For every integer n ≥ 3, every real p > 0, and every f : V(K_n) → ℝ
    on the complete graph K_n, Var_p(M_{K_n} f) ≤ (1 − 1/n) Var_p(f).
    The coefficient is sharp. For each vertex a, the function equal to 1 at a
    and 0 elsewhere has positive p-variation and attains equality.

    Theorem 2. For every such graph G with exactly four vertices, 3/4 is the
    least real c ≥ 0 such that Var_1(M_G f) ≤ c Var_1(f) for every f : V → ℝ.
    Thus the inequality holds with c = 3/4 on each individual graph, and for
    every 0 ≤ c < 3/4 that same graph admits an f with Var_1(M_G f) > c Var_1(f).

    Theorem 4. For every pair of real numbers p > 0 and C > 0 there exist a
    finite connected undirected simple graph G = (V,E) and a function f : V → ℝ
    such that Var_p(M_G f) > C Var_p(f). One can take G to be a finite tree
    and f the indicator of its root, with Var_p(f) = 1.
  authors:
    - "Cristian González-Riquelme"
    - "Vjekoslav Kovač"
    - "José Madrid"
