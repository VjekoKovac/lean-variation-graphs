fidelity:
  divergences: >-
    For Theorem 1, the induction, concentration, uniform Jensen bound and two-term
    Hölder argument follow Section 2. Explicit bounds on the two original Hölder
    coefficients establish the source’s scalar inequality on the full real interval.
    The four-vertex sharp constant is formulated by leastness among admissible
    nonnegative real constants. The six four-vertex bounds use exact rational
    certificates on the linear pieces, plus explicit equality witnesses.
    The unboundedness proof uses the paper’s rooted tree, the root point mass,
    the two ball-cardinality bounds, and the k^m distinguished edges. Its
    strict counterexample to each proposed finite bound implies strict inequality
    for the optimal constant. The five-vertex numerical
    observation and the path conjecture are outside the requested three theorems.
