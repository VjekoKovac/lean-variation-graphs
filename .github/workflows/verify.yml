name: Lean build
"on": [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  LEAN_NUM_THREADS: 2

jobs:
  build:
    name: Lean build
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"
      - name: Fetch pinned Mathlib artifacts
        run: |
          mapfile -t modules < <(git ls-files '*.lean' | xargs awk '/^(public )?import Mathlib/ {print $NF}' | sort -u)
          lake exe cache get "${modules[@]}"
      - name: Build the Lean project
        run: lake build
      - name: Print axiom dependencies
        run: lake env lean Axioms.lean

  comparator:
    name: Lean Comparator
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Fetch pinned Mathlib artifacts
        run: |
          mapfile -t modules < <(git ls-files '*.lean' | xargs awk '/^(public )?import Mathlib/ {print $NF}' | sort -u)
          lake exe cache get "${modules[@]}"
      - name: Compare the three introduction theorems
        run: bash scripts/verify.sh
